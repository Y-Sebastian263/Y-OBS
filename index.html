<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<title>Y-OBS ミニプレイヤー</title>
<style>
  :root {
    --bg: #14111c; --panel: #1f1a2b; --line: #352d47; --text: #f3eefc; --sub: #a99cc4;
    --accent: #ff6fae; --accent2: #7c5cff; --ok: #3ddc97; --warn: #ffc857; --ng: #ff6b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--panel);
    border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); }
  .pill.live .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .pill.wait .dot { background: var(--warn); }
  .pill.err .dot { background: var(--ng); }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 16px; font-size: 14px; color: var(--sub); background: rgba(0,0,0,.55); }
  .overlay[hidden] { display: none; }
  .btns { display: grid; gap: 10px; margin-top: 14px; }
  button, .btn { appearance: none; border: 0; border-radius: 14px; padding: 16px; font-size: 16px;
    font-weight: 700; color: #fff; text-align: center; text-decoration: none; cursor: pointer;
    font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); font-size: 18px; padding: 20px 16px; }
  .secondary { background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 button { padding: 14px 6px; font-size: 15px; }
  .wide { width: 100%; }
  .homehint { position: fixed; inset: 0; z-index: 10; background: rgba(10,8,16,.92);
    display: flex; align-items: flex-end; justify-content: center; padding: 24px 20px max(40px, env(safe-area-inset-bottom)); }
  .homehint-box { text-align: center; width: 100%; max-width: 420px; }
  .homehint-box p { margin: 6px 0; color: var(--sub); }
  .homehint-main { font-size: 22px; font-weight: 800; color: var(--text) !important; line-height: 1.5; }
  .homehint-sub { font-size: 12px; }
  .homehint-arrow { font-size: 56px; animation: up 1.2s ease-in-out infinite; }
  .homehint-box button { margin-top: 18px; width: 100%; }
  @keyframes up { 0%,100% { transform: translateY(8px); opacity: .6; } 50% { transform: translateY(-8px); opacity: 1; } }
  .volrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); }
  .vollabel { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .voltext { font-size: 13px; color: var(--sub); width: 3.2em; text-align: right; }
  .volrow input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .volios { margin: 0; font-size: 12px; color: var(--sub); text-align: center; }
  .openbox { margin-top: 18px; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .openbox.alert { border-color: var(--warn); box-shadow: 0 0 0 2px rgba(255,200,87,.25); }
  .opennote { margin: 0 0 10px; font-size: 13px; color: var(--sub); text-align: center; line-height: 1.5; }
  .openbox.alert .opennote { color: var(--warn); font-weight: 700; }
  .os { background: #2a2338; border: 1px solid var(--line); line-height: 1.3; }
  .os small { font-weight: 500; color: var(--sub); font-size: 12px; }
  .os.hot { background: linear-gradient(135deg, #ffb347, #ff6fae); border: 0; }
  .os.hot small { color: #fff; }
  button:active, .btn:active { transform: scale(.98); }
  .msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--sub); text-align: center; }
  .hint { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 8px 0 12px; }
  .hint b { color: var(--text); }
  .hint { text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Y-OBS ミニプレイヤー</h1>
    <span id="status" class="pill"><span class="dot"></span><span id="statusText">準備中</span></span>
  </header>

  <div class="screen">
    <video id="video" muted playsinline webkit-playsinline autoplay></video>
    <div id="overlay" class="overlay">準備中です。</div>
  </div>

  <div class="btns">
    <button id="goReality" class="primary">ミニプレイヤーにしてREALITYへ戻る</button>
    <div class="row2">
      <button id="pipOnly" class="secondary">ミニプレイヤーだけ</button>
      <button id="sound" class="secondary">🔊 音あり</button>
    </div>
    <div id="volRow" class="volrow">
      <span class="vollabel">音量</span>
      <input id="volume" type="range" min="0" max="100" step="5" value="80" aria-label="音量">
      <span id="volText" class="voltext">80%</span>
    </div>
    <p id="volIos" class="volios" hidden>iPhoneは本体の音量ボタンで調整してください</p>
    <button id="reload" class="secondary wide">🔄 再接続</button>
  </div>
  <div id="msg" class="msg"></div>

  <div id="openBox" class="openbox">
    <p id="openNote" class="opennote">映らない・ミニプレイヤーにならない時は、ブラウザで開き直してください</p>
    <div class="row2">
      <button id="openIos" class="os">iPhone<br><small>Safariで開く</small></button>
      <button id="openAndroid" class="os">Android<br><small>Chromeで開く</small></button>
    </div>
  </div>
</div>

<div id="homeHint" class="homehint" hidden>
  <div class="homehint-box">
    <div class="homehint-arrow">⬆</div>
    <p>ミニプレイヤーになりました</p>
    <p class="homehint-main">画面の一番下から<br>上にスワイプしてホーム画面へ</p>
    <p class="homehint-sub">(ホームボタンがある機種はホームボタンを押す)</p>
    <button id="homeHintClose" class="secondary">閉じる</button>
  </div>
</div>

<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(() => {
  const CONFIG = window.YOBS_CONFIG || {};
  const REALITY_PACKAGE = CONFIG.realityPackage || 'net.wrightflyer.le.reality';
  const RETURN_URL = CONFIG.returnUrl || 'https://reality.app/';
  const KEY_SOUND = 'yobs.sound';

  const $ = (id) => document.getElementById(id);
  const video = $('video'), overlay = $('overlay'), msg = $('msg');
  const ua = navigator.userAgent;
  const isIOS = /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);

  // ---- 保存まわり(localStorage は使えない環境もあるので try で包む) ----
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
  };

  // 接続先は config.js で固定(視聴者はページを開くだけ)。
  // テスト用に ?src=...&rtc=... での上書きもできる(アドレスバーからは消す)
  const params = new URLSearchParams(location.search);
  let src = CONFIG.hlsUrl || '';
  let rtcUrl = CONFIG.rtcUrl || '';
  if (params.get('src')) {
    src = params.get('src').trim();
    rtcUrl = (params.get('rtc') || '').trim();
    history.replaceState(null, '', location.pathname);
  }

  // ---- 音声(自動再生はミュート必須なので、タップ時に音を出す) ----
  let soundOn = store.get(KEY_SOUND) !== 'off';
  function drawSound() { $('sound').textContent = soundOn ? '🔊 音あり' : '🔇 音なし'; }
  let userTapped = false;
  function applySound() { userTapped = true; video.muted = !soundOn; drawSound(); }

  // ---- 音量(iPhone の Safari はページから音量を変えられないので本体ボタンで) ----
  const KEY_VOL = 'yobs.vol';
  let vol = parseInt(store.get(KEY_VOL) || '80', 10);
  if (!(vol >= 0 && vol <= 100)) vol = 80;
  function applyVolume() {
    video.volume = vol / 100;
    $('volume').value = vol;
    $('volText').textContent = vol + '%';
  }
  if (isIOS) {
    $('volRow').hidden = true;
    $('volIos').hidden = false;
  } else {
    applyVolume();
    $('volume').addEventListener('input', () => {
      vol = parseInt($('volume').value, 10);
      store.set(KEY_VOL, String(vol));
      applyVolume();
      // 音量を動かしたら音ありにする(0なら音なし)
      soundOn = vol > 0;
      store.set(KEY_SOUND, soundOn ? 'on' : 'off');
      applySound();
      video.play().catch(() => {});
    });
  }
  drawSound();

  // ---- 状態表示 ----
  function setStatus(kind, text) {
    $('status').className = 'pill ' + kind;
    $('statusText').textContent = text;
  }
  function showOverlay(text) { overlay.innerHTML = text; overlay.hidden = !text; }
  function say(text) { msg.textContent = text || ''; }

  // ---- 再生 ----
  // Android 等: 低遅延(WebRTC/WHEP)を優先し、つながらなければ HLS へ。
  // iPhone: Safari は WebRTC 映像をミニプレイヤーにできないため HLS。
  let hls = null, pc = null, retryTimer = null, rtcTimer = null;
  let mode = '';            // 'rtc' | 'hls'
  let rtcGaveUp = false;    // このページを開いている間 WebRTC がつながらなかった
  let gen = 0;              // 古い接続処理を無視するための番号

  function stopPlayer() {
    gen++;
    clearTimeout(retryTimer); clearTimeout(rtcTimer);
    if (hls) { hls.destroy(); hls = null; }
    if (pc) { try { pc.close(); } catch {} pc = null; }
    video.srcObject = null;
    video.removeAttribute('src');
    video.load();
    mode = '';
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    setStatus('wait', '配信待ち');
    showOverlay('配信はまだ始まっていません。<br>始まると自動で映ります。');
    retryTimer = setTimeout(startPlayer, 3000);
  }

  function useRtc() {
    return !!rtcUrl && !isIOS && !rtcGaveUp && 'RTCPeerConnection' in window;
  }

  function startPlayer() {
    stopPlayer();
    if (!src) {
      setStatus('', '未設定');
      showOverlay('準備中です。');
      return;
    }
    video.muted = !userTapped || !soundOn; // 自動再生のため最初はミュート
    setStatus('wait', '接続中');
    if (useRtc()) startRtc(); else startHls();
  }

  function rtcFallback() {
    // WebRTC がつながらない(別の回線など)→ 今回は HLS で再生
    rtcGaveUp = true;
    say('低遅延モードでつながらなかったので、通常モード(2秒前後)で再生しています。');
    startPlayer();
  }

  function waitIce(conn) {
    if (conn.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise((res) => {
      const t = setTimeout(res, 1500);
      conn.addEventListener('icegatheringstatechange', () => {
        if (conn.iceGatheringState === 'complete') { clearTimeout(t); res(); }
      });
    });
  }

  async function startRtc() {
    const my = gen;
    mode = 'rtc';
    const conn = pc = new RTCPeerConnection();
    conn.addTransceiver('video', { direction: 'recvonly' });
    conn.addTransceiver('audio', { direction: 'recvonly' });
    const ms = new MediaStream();
    conn.ontrack = (e) => {
      ms.addTrack(e.track);
      try { e.receiver.jitterBufferTarget = 0; } catch {}
      if (video.srcObject !== ms) video.srcObject = ms;
      video.play().catch(() => {});
    };
    conn.onconnectionstatechange = () => {
      if (my !== gen) return;
      const st = conn.connectionState;
      if (st === 'failed') rtcFallback();
      else if (st === 'disconnected' || st === 'closed') scheduleRetry();
    };
    // 一定時間つながらなければ HLS に切り替え
    rtcTimer = setTimeout(() => { if (my === gen && conn.connectionState !== 'connected') rtcFallback(); }, 8000);

    try {
      await conn.setLocalDescription(await conn.createOffer());
      await waitIce(conn);
      if (my !== gen) return;
      const res = await fetch(rtcUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: conn.localDescription.sdp,
      });
      if (my !== gen) return;
      if (res.status === 404 || res.status === 400) { clearTimeout(rtcTimer); scheduleRetry(); return; } // まだ配信していない
      if (!res.ok) throw new Error('HTTP ' + res.status);
      await conn.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    } catch (e) {
      if (my === gen) rtcFallback();
    }
  }

  function startHls() {
    mode = 'hls';
    const nativeHls = video.canPlayType('application/vnd.apple.mpegurl');
    // iPhone は標準プレイヤー(ミニプレイヤー対応のため)、それ以外は hls.js を優先
    if (isIOS && nativeHls) {
      video.src = src;
      video.play().catch(() => {});
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        lowLatencyMode: true,
        liveSyncDuration: 1.5,
        liveMaxLatencyDuration: 6,
        maxLiveSyncPlaybackRate: 1.5,
        backBufferLength: 10,
        manifestLoadingMaxRetry: 0,
      });
      hls.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) scheduleRetry(); });
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    } else if (nativeHls) {
      video.src = src;
      video.play().catch(() => {});
    } else {
      setStatus('err', '非対応');
      showOverlay('このブラウザでは再生できません。<br>iPhoneはSafari、AndroidはChromeで開いてください。');
    }
  }

  video.addEventListener('playing', () => {
    clearTimeout(rtcTimer);
    setStatus('live', mode === 'rtc' ? '再生中(低遅延)' : '再生中');
    showOverlay('');
  });
  video.addEventListener('waiting', () => setStatus('wait', '読み込み中'));
  video.addEventListener('error', () => { if (mode === 'hls' && !hls) scheduleRetry(); });
  video.addEventListener('ended', scheduleRetry);
  // 一時停止されたら(ミニプレイヤー中も含めて)すぐ再開する
  video.addEventListener('pause', () => { if (src && !video.ended) setTimeout(() => video.play().catch(() => {}), 300); });

  // 標準プレイヤー時、遅れが溜まったら最新位置へ追いつく
  setInterval(() => {
    if (mode !== 'hls' || hls || !video.seekable || !video.seekable.length) return;
    const edge = video.seekable.end(video.seekable.length - 1);
    if (edge - video.currentTime > 4) video.currentTime = edge - 1;
  }, 2000);

  // ---- ミニプレイヤー ----
  const inPip = () => !!document.pictureInPictureElement || video.webkitPresentationMode === 'picture-in-picture';

  function enterPip() {
    if (inPip()) return Promise.resolve();
    if (video.readyState < 2) return Promise.reject(new Error('まだ映像が届いていません'));
    if (video.requestPictureInPicture && document.pictureInPictureEnabled !== false) {
      return video.requestPictureInPicture();
    }
    if (video.webkitSupportsPresentationMode && video.webkitSupportsPresentationMode('picture-in-picture')) {
      video.webkitSetPresentationMode('picture-in-picture');
      return Promise.resolve();
    }
    return Promise.reject(new Error('このブラウザはミニプレイヤーに対応していません'));
  }

  // ---- REALITYへ戻る ----
  function returnUrl() {
    const custom = RETURN_URL;
    if (isAndroid) {
      // https のリンクを REALITY アプリ指定で開く(未インストール時はリンク先へ)
      try {
        const u = new URL(custom);
        if (u.protocol === 'https:' || u.protocol === 'http:') {
          return 'intent://' + u.host + u.pathname + u.search +
            '#Intent;scheme=' + u.protocol.replace(':', '') +
            ';package=' + REALITY_PACKAGE +
            ';S.browser_fallback_url=' + encodeURIComponent(custom) + ';end';
        }
      } catch {}
    }
    return custom;
  }

  let wantReturn = false;
  function openReality() {
    wantReturn = false;
    location.href = returnUrl();
  }

  // 「ミニプレイヤーだけ」の後はホーム画面へ。
  // Android(Chrome)はミニプレイヤーになると自動でホーム側に戻る。
  // iPhone はページからホームへ戻せないので、スワイプの案内を出す。
  let wantHome = false;
  function onPipEntered() {
    $('goReality').textContent = 'REALITYを開く';
    if (wantReturn) setTimeout(openReality, 150);
    if (wantHome && isIOS) $('homeHint').hidden = false;
    wantHome = false;
  }
  function onPipLeft() {
    $('goReality').textContent = 'ミニプレイヤーにしてREALITYへ戻る';
    $('homeHint').hidden = true;
  }
  $('homeHintClose').addEventListener('click', () => { $('homeHint').hidden = true; });
  video.addEventListener('enterpictureinpicture', onPipEntered);
  video.addEventListener('leavepictureinpicture', onPipLeft);
  video.addEventListener('webkitpresentationmodechanged', () => inPip() ? onPipEntered() : onPipLeft());

  $('goReality').addEventListener('click', () => {
    say('');
    applySound();
    if (inPip()) { openReality(); return; }
    wantReturn = true;
    enterPip().catch((e) => {
      wantReturn = false;
      say(e.message + '。そのままREALITYを開く場合はもう一度タップ。');
      $('goReality').textContent = 'REALITYを開く(映像なし)';
      $('goReality').onclick = () => { $('goReality').onclick = null; openReality(); };
    });
    // 自動で切り替わらなかったとき用の案内
    setTimeout(() => {
      if (wantReturn && document.visibilityState === 'visible' && inPip()) {
        say('REALITYが開かない時は、もう一度「REALITYを開く」をタップしてください。');
      }
    }, 1500);
  });

  $('pipOnly').addEventListener('click', () => {
    say('');
    wantReturn = false;
    wantHome = true;
    applySound();
    enterPip().catch((e) => { wantHome = false; say(e.message); });
  });

  $('sound').addEventListener('click', () => {
    soundOn = !soundOn;
    store.set(KEY_SOUND, soundOn ? 'on' : 'off');
    applySound();
    video.play().catch(() => {});
  });

  // 再接続: ページごと最新の状態で読み込み直す
  $('reload').addEventListener('click', () => {
    location.replace(location.pathname + '?r=' + Date.now());
  });

  // ---- 正しいブラウザで開き直す ----
  const pageUrl = location.origin + location.pathname;
  // アプリ内ブラウザ(LINE, X, Instagram, Discord など)や iPhone の Safari 以外を判定
  const inApp = /Line\/|FBAN|FBAV|Instagram|Twitter|TikTok|musical_ly|Discord|KAKAOTALK|; wv\)|GSA\//i.test(ua) ||
    (isIOS && !/Safari\//.test(ua)) ||
    (isIOS && /CriOS|FxiOS|EdgiOS/.test(ua));
  if (inApp) {
    $('openBox').classList.add('alert');
    $('openNote').textContent = 'アプリ内のブラウザで開いています。下のボタンでブラウザに切り替えてください';
    (isAndroid ? $('openAndroid') : $('openIos')).classList.add('hot');
  }

  $('openIos').addEventListener('click', () => {
    if (isIOS && !inApp) { say('もうSafariで開いています'); return; }
    // iOS 17 以降: x-safari-https で Safari を直接開く。LINE は openExternalBrowser も効く
    if (/Line\//i.test(ua)) { location.href = pageUrl + '?openExternalBrowser=1'; return; }
    location.href = 'x-safari-' + pageUrl;
    setTimeout(() => say('開かない時は、右上(または下)のメニューから「Safariで開く」を選んでください'), 1200);
  });

  $('openAndroid').addEventListener('click', () => {
    if (isAndroid && !inApp && /Chrome\//.test(ua)) { say('もうChromeで開いています'); return; }
    const u = new URL(pageUrl);
    location.href = 'intent://' + u.host + u.pathname + '#Intent;scheme=https;package=com.android.chrome;' +
      'S.browser_fallback_url=' + encodeURIComponent(pageUrl) + ';end';
    setTimeout(() => say('開かない時は、メニューから「ブラウザで開く」を選んでください'), 1200);
  });

  // 画面に戻ってきたら止まっていないか確認
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && src && video.paused) video.play().catch(() => {});
  });

  startPlayer();
})();
</script>
</body>
</html>
